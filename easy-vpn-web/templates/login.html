<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EasyVPN — Login</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;600;700&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{--bg:#0b0d11;--surface:#13161d;--border:#1e2230;--border2:#2a2f42;--green:#00ffa3;--green-dim:#00ffa320;--red:#ff4d6d;--text:#e2e8f0;--muted:#64748b;--font-mono:'JetBrains Mono',monospace;--font-sans:'Syne',sans-serif}
    body{background:var(--bg);color:var(--text);font-family:var(--font-sans);min-height:100vh;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
    body::before{content:'';position:fixed;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,.06) 2px,rgba(0,0,0,.06) 4px);pointer-events:none;z-index:9999}
    body::after{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(0,255,163,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(0,255,163,.04) 1px,transparent 1px);background-size:40px 40px;pointer-events:none}
    .glow{position:fixed;width:600px;height:600px;border-radius:50%;background:radial-gradient(circle,rgba(0,255,163,.07) 0%,transparent 70%);top:50%;left:50%;transform:translate(-50%,-50%);pointer-events:none}
    .login-box{background:var(--surface);border:1px solid var(--border2);border-radius:12px;padding:48px 40px;width:100%;max-width:400px;position:relative;z-index:1}
    .wordmark{font-size:1.4rem;font-weight:800;letter-spacing:.04em;color:var(--green);text-transform:uppercase}
    .tagline{font-family:var(--font-mono);font-size:.65rem;color:var(--muted);margin-top:4px;letter-spacing:.08em;margin-bottom:36px}
    label{display:block;font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin-bottom:8px}
    input[type=password]{width:100%;background:var(--bg);border:1px solid var(--border2);border-radius:6px;color:var(--text);font-family:var(--font-mono);font-size:.9rem;padding:12px 14px;outline:none;transition:border-color .15s;margin-bottom:20px;letter-spacing:.1em}
    input:focus{border-color:var(--green);box-shadow:0 0 0 2px var(--green-dim)}
    button{width:100%;background:var(--green);color:#0b0d11;border:none;border-radius:6px;padding:12px;font-family:var(--font-sans);font-size:.82rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;transition:opacity .15s}
    button:hover{opacity:.88}
    .alert{background:#ff4d6d22;border:1px solid #ff4d6d55;color:var(--red);border-radius:6px;padding:10px 14px;font-family:var(--font-mono);font-size:.75rem;margin-bottom:20px}
    .corner{position:absolute;width:16px;height:16px;border-color:var(--green);border-style:solid;opacity:.5}
    .corner-tl{top:-1px;left:-1px;border-width:2px 0 0 2px}.corner-tr{top:-1px;right:-1px;border-width:2px 2px 0 0}
    .corner-bl{bottom:-1px;left:-1px;border-width:0 0 2px 2px}.corner-br{bottom:-1px;right:-1px;border-width:0 2px 2px 0}
  </style>
</head>
<body>
  <div class="glow"></div>
  <div class="login-box">
    <div class="corner corner-tl"></div><div class="corner corner-tr"></div>
    <div class="corner corner-bl"></div><div class="corner corner-br"></div>
    <div class="wordmark">⬡ EasyVPN</div>
    <div class="tagline">// Secure Access Management Console</div>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for cat, msg in messages %}<div class="alert">⚠ {{ msg }}</div>{% endfor %}
    {% endwith %}
    <form method="POST">
      <label for="password">Admin Password</label>
      <input type="password" id="password" name="password" placeholder="••••••••••••" autofocus required />
      <button type="submit">Authenticate →</button>
    </form>
  </div>
</body>
</html>
