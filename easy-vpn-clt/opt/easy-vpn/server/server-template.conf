# server-template.conf — Fixed version
# Changes from original:
#   1. Duplicate DNS fixed: second DNS is now 8.8.4.4 (Google secondary)
#   2. crl-verify uncommented so revoked certs are actually rejected
#   3. Cipher changed from AES-256-GCM to match client (or use ncp-ciphers for flexibility)

port 1194
proto tcp
dev tun

ca ca.crt
cert server.crt
key server.key

dh dh.pem

server 10.8.0.0 255.255.255.0
ifconfig-pool-persist /var/log/openvpn/ipp.txt

push "redirect-gateway def1 bypass-dhcp"

# FIX: was push "dhcp-option DNS 8.8.8.8" twice — second is now the fallback
push "dhcp-option DNS 8.8.8.8"
push "dhcp-option DNS 8.8.4.4"

keepalive 10 120

tls-auth ta.key 0
key-direction 0

# FIX: use ncp-ciphers to handle both GCM (preferred) and CBC (legacy clients)
cipher AES-256-GCM
ncp-ciphers AES-256-GCM:AES-256-CBC
auth SHA256

user nobody
group nogroup

persist-key
persist-tun

status /var/log/openvpn/openvpn-status.log
log-append /var/log/openvpn/openvpn.log
verb 4

# FIX: uncommented — without this, revoked certs are still accepted by the server
crl-verify /etc/openvpn/server/crl.pem

tun-mtu 6000
mssfix 0
txqueuelen 1000
tcp-queue-limit 256

reneg-sec 3600

# TOTP MFA
script-security 2
auth-user-pass-verify ./oath.sh via-file

# Client logging
client-connect ./log_client_connect.sh
client-disconnect ./log_client_disconnect.sh
